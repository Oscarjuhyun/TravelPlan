=<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ AI 여행 플래너</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#F4F7FB;color:#1E3A4A;min-height:100vh}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

.container{max-width:860px;margin:0 auto;padding:1.5rem 1rem 3rem}

/* 헤더 */
.hero{background:linear-gradient(135deg,#0B3D5E 0%,#1A7A8A 60%,#2AB5A0 100%);border-radius:16px;padding:2rem 2.2rem 1.6rem;margin-bottom:1.6rem;color:white}
.hero h1{font-size:1.8rem;font-weight:700;margin-bottom:.3rem;letter-spacing:-.02em}
.hero p{font-size:.9rem;opacity:.85}

/* 카드 */
.card{background:white;border:1px solid #E2ECF4;border-radius:14px;padding:1.2rem 1.4rem;margin-bottom:1.2rem;box-shadow:0 2px 8px rgba(0,60,100,.04)}
.card-label{font-size:.78rem;font-weight:500;color:#6B8EB0;margin-bottom:.6rem;display:block}

/* API 키 */
.api-row{display:flex;gap:8px}
.api-input{flex:1;padding:9px 12px;border:1.5px solid #E2ECF4;border-radius:10px;font-size:.9rem;font-family:monospace;outline:none;transition:border-color .2s}
.api-input:focus{border-color:#2AB5A0}
.api-save{padding:9px 18px;background:#2AB5A0;color:white;border:none;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s}
.api-save:hover{background:#1A7A8A}
.api-hint{font-size:.72rem;color:#6B8EB0;margin-top:.5rem}
.api-ok{color:#1A7A8A;font-size:.78rem;font-weight:600;margin-top:.4rem;display:none}

/* 모델 선택 */
.model-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:.5rem}
.model-btn{padding:5px 14px;border:1.5px solid #E2ECF4;border-radius:20px;font-size:.78rem;cursor:pointer;background:white;color:#6B8EB0;transition:all .15s}
.model-btn.active{border-color:#2AB5A0;background:#E1F5EE;color:#0F6E56;font-weight:600}

/* 폼 */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-grid-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:10px}
.input-field{width:100%;padding:9px 12px;border:1.5px solid #E2ECF4;border-radius:10px;font-size:.88rem;outline:none;transition:border-color .2s;background:white}
.input-field:focus{border-color:#2AB5A0}
.radio-group{display:flex;gap:0;border:1.5px solid #E2ECF4;border-radius:10px;overflow:hidden}
.radio-btn{flex:1;padding:9px 0;border:none;background:white;font-size:.88rem;cursor:pointer;color:#6B8EB0;transition:all .2s;font-family:inherit}
.radio-btn.active{background:#0B3D5E;color:white;font-weight:600}

/* 태그 */
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{padding:5px 13px;border:1.5px solid #E2ECF4;border-radius:20px;font-size:.8rem;cursor:pointer;background:white;color:#6B8EB0;transition:all .15s}
.tag.active{border-color:#2AB5A0;background:#E1F5EE;color:#0F6E56;font-weight:600}

/* 슬라이더 */
.slider-wrap{display:flex;align-items:center;gap:10px}
.slider-wrap input[type=range]{flex:1;height:4px;-webkit-appearance:none;accent-color:#2AB5A0}
.slider-val{font-size:.88rem;font-weight:600;color:#0B3D5E;min-width:52px}
.num-input{width:100%;padding:9px 12px;border:1.5px solid #E2ECF4;border-radius:10px;font-size:.88rem;text-align:center;outline:none;transition:border-color .2s}
.num-input:focus{border-color:#2AB5A0}
.num-label{font-size:.78rem;color:#6B8EB0;margin-bottom:4px;display:block}

/* 실행 버튼 */
.run-btn{width:100%;padding:13px;background:linear-gradient(135deg,#0B3D5E,#1A7A8A);color:white;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:4px;font-family:inherit}
.run-btn:hover{opacity:.9}
.run-btn:disabled{opacity:.5;cursor:not-allowed}

/* 에이전트 상태 */
.agent-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:1.2rem 0}
.agent-card{background:white;border:1.5px solid #E2ECF4;border-radius:12px;padding:.8rem .6rem;text-align:center;transition:all .3s}
.agent-card.running{border-color:#2AB5A0;background:#F0FAFA}
.agent-card.done{border-color:#1A7A8A;background:#EAF6F8}
.agent-card.skip{opacity:.4}
.agent-icon{font-size:1.4rem;margin-bottom:.25rem}
.agent-name{font-size:.72rem;font-weight:500;color:#334E6A}
.agent-state{font-size:.65rem;color:#6B8EB0;margin-top:.1rem}
.agent-card.running .agent-state{color:#2AB5A0;font-weight:600}
.agent-card.done .agent-state{color:#1A7A8A;font-weight:600}

/* 섹션 */
.sec-wrap{background:white;border:1px solid #E2ECF4;border-radius:14px;margin-bottom:1.1rem;overflow:hidden;box-shadow:0 2px 8px rgba(0,60,100,.04)}
.sec-head{background:linear-gradient(90deg,#0B3D5E,#1A7A8A);color:white;padding:.7rem 1.1rem;display:flex;align-items:center;gap:.5rem;font-size:.92rem;font-weight:600}
.sec-body{padding:1rem 1.2rem}

/* 여행지 */
.dest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dest-card{border:1.5px solid #E2ECF4;border-radius:12px;padding:.9rem .8rem;text-align:center}
.dest-card.top{border-color:#2AB5A0;background:linear-gradient(135deg,#F0FAFA,#EAF6F8)}
.dest-flag{font-size:2rem;margin-bottom:.2rem}
.dest-name{font-size:.88rem;font-weight:700;color:#0B3D5E;margin:.25rem 0 .1rem}
.dest-sub{font-size:.72rem;color:#6B8EB0}
.dest-score{font-size:.72rem;color:#2AB5A0;font-weight:600;margin-top:.25rem}
.dest-reason{font-size:.7rem;color:#334E6A;margin-top:.3rem;line-height:1.4}

/* 항공 */
.flight-card{border:1px solid #E2ECF4;border-radius:10px;padding:.85rem .95rem;margin-bottom:.6rem}
.flt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem}
.flt-airline{font-size:.86rem;font-weight:600;color:#0B3D5E}
.flt-price{font-size:.98rem;font-weight:700;color:#2AB5A0}
.flt-row{display:flex;align-items:center;gap:8px}
.flt-time{font-size:.98rem;font-weight:600;color:#0B3D5E}
.flt-line{flex:1;height:1px;background:#E2ECF4;position:relative}
.flt-dur{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:.65rem;color:#6B8EB0;background:white;padding:0 4px;white-space:nowrap}
.badge{display:inline-block;font-size:.68rem;padding:2px 9px;border-radius:20px;background:#EAF6F8;color:#1A7A8A;font-weight:600;margin-top:.35rem}

/* 일정 */
.day-block{border-left:2px solid #BDDFEA;padding-left:.9rem;margin-left:.4rem;padding-bottom:.85rem;position:relative}
.day-dot{width:10px;height:10px;border-radius:50%;background:#1A7A8A;position:absolute;left:-6px;top:3px}
.day-title{font-size:.8rem;font-weight:700;color:#1A7A8A;margin-bottom:.45rem}
.item-row{display:flex;gap:7px;margin-bottom:.3rem;align-items:flex-start}
.item-time{font-size:.7rem;color:#6B8EB0;white-space:nowrap;padding-top:2px;min-width:36px}
.item-text{font-size:.8rem;color:#1E3A4A;line-height:1.4}
.meal-tag{display:inline-block;font-size:.63rem;padding:1px 7px;border-radius:20px;background:#FFF5E6;color:#B06E00;font-weight:600;white-space:nowrap;margin-top:1px}
.rest-name{font-weight:600}
.rest-desc{font-size:.72rem;color:#6B8EB0}

/* 렌터카 */
.car-card{border:1px solid #E2ECF4;border-radius:10px;padding:.8rem .95rem;margin-bottom:.6rem;display:flex;justify-content:space-between;align-items:center}
.car-name{font-size:.88rem;font-weight:600;color:#0B3D5E}
.car-spec{font-size:.72rem;color:#6B8EB0;margin-top:2px}
.car-day{font-size:.98rem;font-weight:700;color:#0B3D5E;text-align:right}
.car-total{font-size:.7rem;color:#6B8EB0;text-align:right;margin-top:1px}

/* 비용 */
.cost-bar{background:linear-gradient(135deg,#0B3D5E,#1A7A8A);border-radius:14px;padding:1rem 1.3rem;color:white;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.cost-item .cl{font-size:.68rem;opacity:.75;margin-bottom:3px}
.cost-item .cv{font-size:1rem;font-weight:700}
.cost-item.total .cv{color:#7DECD8;font-size:1.15rem}

.tip{font-size:.75rem;color:#6B8EB0;margin-top:.65rem;line-height:1.6}

/* 로딩 스피너 */
.spin{display:inline-block;width:10px;height:10px;border:1.5px solid #9FE1CB;border-top-color:#0F6E56;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}

.hidden{display:none}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* 오류 */
.error-box{background:#fff0f0;border:1px solid #f7c1c1;border-radius:10px;padding:.8rem 1rem;color:#a32d2d;font-size:.85rem;margin:.8rem 0}

/* 반응형 */
@media(max-width:600px){
  .agent-grid{grid-template-columns:repeat(3,1fr)}
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .hero h1{font-size:1.4rem}
}
</style>
</head>
<body>
<div class="container">

  <!-- 헤더 -->
  <div class="hero">
    <h1>✈️ AI 여행 플래너</h1>
    <p>Gemini 에이전트 5팀이 여행지 · 항공 · 일정 · 렌터카 · 비용을 한 번에 분석합니다</p>
  </div>

  <!-- 입력 폼 -->
  <div class="card">
    <span class="card-label">🔍 여행 조건 입력</span>

    <div class="form-grid" style="margin-bottom:10px">
      <input class="input-field" id="kwInput" placeholder="여행 키워드 (예: 바다, 휴식, 아이와 함께)" />
      <div class="radio-group">
        <button class="radio-btn active" id="btnDomestic" onclick="setType('domestic')">🏠 국내</button>
        <button class="radio-btn" id="btnOverseas" onclick="setType('overseas')">✈️ 해외</button>
      </div>
    </div>

    <div class="tag-row" id="tagRow">
      <span class="tag" onclick="toggleTag(this)">🏖 바다</span>
      <span class="tag" onclick="toggleTag(this)">🌿 자연·숲</span>
      <span class="tag" onclick="toggleTag(this)">🛕 문화·역사</span>
      <span class="tag" onclick="toggleTag(this)">🍜 미식</span>
      <span class="tag" onclick="toggleTag(this)">🧘 힐링·휴식</span>
      <span class="tag" onclick="toggleTag(this)">👨 👩 👧 아이와 함께</span>
      <span class="tag" onclick="toggleTag(this)">🏄 액티비티</span>
      <span class="tag" onclick="toggleTag(this)">🌃 도시·야경</span>
    </div>

    <div class="form-grid-3">
      <div>
        <span class="num-label">여행 기간</span>
        <div class="slider-wrap">
          <input type="range" min="1" max="14" value="3" step="1" id="nightsSlider" oninput="updateNights(this.value)" />
          <span class="slider-val" id="nightsVal">3박 4일</span>
        </div>
      </div>
      <div>
        <span class="num-label">성인 (만 13세↑)</span>
        <input class="num-input" type="number" id="adults" min="1" max="20" value="2" />
      </div>
      <div>
        <span class="num-label">아동 (만 12세↓)</span>
        <input class="num-input" type="number" id="children" min="0" max="10" value="0" />
      </div>
    </div>

    <button class="run-btn" id="runBtn" onclick="runAgent()">🚀 여행 계획 생성하기</button>
  </div>

  <!-- 에이전트 상태 -->
  <div id="agentWrap" class="hidden">
    <div class="agent-grid">
      <div class="agent-card" id="ag-dest"><div class="agent-icon">🗺️</div><div class="agent-name">여행지 탐색</div><div class="agent-state" id="st-dest">대기 중</div></div>
      <div class="agent-card" id="ag-flight"><div class="agent-icon">✈️</div><div class="agent-name">항공·교통</div><div class="agent-state" id="st-flight">대기 중</div></div>
      <div class="agent-card" id="ag-sched"><div class="agent-icon">📅</div><div class="agent-name">일정 생성</div><div class="agent-state" id="st-sched">대기 중</div></div>
      <div class="agent-card" id="ag-car"><div class="agent-icon">🚗</div><div class="agent-name">렌터카</div><div class="agent-state" id="st-car">대기 중</div></div>
      <div class="agent-card" id="ag-cost"><div class="agent-icon">💰</div><div class="agent-name">비용 분석</div><div class="agent-state" id="st-cost">대기 중</div></div>
    </div>
  </div>

  <!-- 오류 -->
  <div id="errorBox" class="error-box hidden"></div>

  <!-- 결과 -->
  <div id="resultWrap" class="hidden"></div>

</div>

<script>
// ──────────────────────────────────────────────
// 상태
// ──────────────────────────────────────────────
let API_KEY   = '';  // ← 여기에 API 키 입력
// ★ 184번째 줄에 해당 — 모델명
let MODEL     = 'gemini-3.1-flash-lite';
let travelType = 'domestic';
let nights    = 3;
let activeTags = new Set();

// ──────────────────────────────────────────────
// API 키 & 모델
// ──────────────────────────────────────────────


function saveApiKey(){
   const v = document.getElementById('apiInpu').value.trim();
   if(!v){ alert('API 키를 입력하세요.'); return;}
   API_KEY = v;
   document.getElementById('api0k').style.display = "block';  
}

// ──────────────────────────────────────────────
// 폼 인터랙션
// ──────────────────────────────────────────────
function setType(t){
  travelType = t;
  document.getElementById('btnDomestic').classList.toggle('active', t==='domestic');
  document.getElementById('btnOverseas').classList.toggle('active', t==='overseas');
}

function toggleTag(el){
  el.classList.toggle('active');
  const txt = el.textContent.trim();
  activeTags.has(txt) ? activeTags.delete(txt) : activeTags.add(txt);
}

function updateNights(v){
  nights = parseInt(v);
  document.getElementById('nightsVal').textContent = nights+'박 '+(nights+1)+'일';
}

function getKeywords(){
  const manual = document.getElementById('kwInput').value.trim();
  const tags   = [...activeTags].map(t=>t.replace(/^[^\w가-힣]+/,'').trim());
  const all    = manual ? [manual,...tags] : tags;
  return all.length ? all.join(', ') : '기본 추천';
}

function getPeople(){
  return {
    adults:   parseInt(document.getElementById('adults').value)||2,
    children: parseInt(document.getElementById('children').value)||0,
  };
}

// ──────────────────────────────────────────────
// 에이전트 상태 UI
// ──────────────────────────────────────────────
function agState(id, state, msg){
  const card = document.getElementById('ag-'+id);
  const st   = document.getElementById('st-'+id);
  card.className = 'agent-card '+(state||'');
  st.innerHTML = state==='running'
    ? `<span class="spin"></span>${msg}`
    : msg;
}

// ──────────────────────────────────────────────
// Gemini API 호출 (app.py 185번째 줄 역할)
// ──────────────────────────────────────────────
async function callGemini(prompt){
  // ★ 이 URL이 app.py 185번째 줄 genai.configure(api_key=api_key) 와 동일한 역할
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts:[{text:prompt}]}]})
  });
  if(!res.ok){
    const err = await res.json();
    throw new Error(err.error?.message || '알 수 없는 오류');
  }
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

// ──────────────────────────────────────────────
// 프롬프트 (app.py 205~326번째 줄과 동일)
// ──────────────────────────────────────────────
function pDest(kw, type, n){
  return `당신은 여행 전문 에이전트입니다. 아래 조건에 맞는 여행지 4곳을 추천하세요.
[조건] 키워드:${kw} / 유형:${type==='domestic'?'국내':'해외'} / 기간:${n}박${n+1}일
[형식] 다른 설명 없이 아래 형식만:
DEST1|이모지|여행지명|부제목|추천점수(0-100)|추천이유
DEST2|이모지|여행지명|부제목|추천점수|추천이유
DEST3|이모지|여행지명|부제목|추천점수|추천이유
DEST4|이모지|여행지명|부제목|추천점수|추천이유`;
}

function pFlight(dest, type, n){
  const note = type==='domestic'
    ? '국내선 또는 KTX/버스 육상교통 포함' : '국제선 항공편 위주';
  return `당신은 항공·교통 전문 에이전트입니다. ${dest} 여행(${n}박${n+1}일) 교통편 2~3개를 추천하세요. ${note}
[형식] 다른 설명 없이:
FLIGHT|항공사/교통수단|출발지·출발시간|도착지·도착시간|소요시간|편도요금|직항여부`;
}

function pSched(dest, kw, n, type){
  return `당신은 여행 일정 전문 에이전트입니다. ${dest} ${n}박${n+1}일 일정을 만들어주세요.
키워드:${kw} / 식사마다 실제 맛집이름·메뉴·평점 포함
[형식] 다른 설명 없이 ${n+1}일치 전체:
DAY|일차|테마
ACT|시간대|활동내용
MEAL|아침/점심/저녁|식당명|메뉴·특징|평점`;
}

function pCar(dest, n, total){
  const seat = total<=2 ? '소형 포함' : `총 ${total}명 탑승 가능 차량 위주`;
  return `당신은 렌터카 전문 에이전트입니다. ${dest} 여행(${n}일, ${total}명) 렌터카 3종 추천. ${seat}
[형식] 다른 설명 없이:
CAR|차종명|등급|좌석수|변속기|일일요금|총요금(${n}일)|주의사항`;
}

function pCost(dest, type, n, flightTxt, carTxt, adults, children){
  const total = adults+children;
  const ppl   = `성인${adults}명`+(children>0?`+아동${children}명`:'');
  const child_note = children>0 ? `아동${children}명 소아요금(성인 75%) 반영` : '';
  return `당신은 여행 비용 분석 에이전트입니다. ${ppl}(총${total}명) 기준 여행비용 분석.
목적지:${dest} / 유형:${type==='domestic'?'국내':'해외'} / ${n}박${n+1}일 / ${child_note}
[항공] ${flightTxt}
[렌터카] ${carTxt}
[형식] 다른 설명 없이:
COST|항목명|${total}명 기준 금액|설명`;
}

// ──────────────────────────────────────────────
// 파서
// ──────────────────────────────────────────────
function parseDests(txt){
  return txt.split('\n').filter(l=>l.match(/^DEST\d/)).map(l=>{
    const p=l.split('|');
    return {rank:p[0],flag:p[1]||'',name:p[2]||'',sub:p[3]||'',score:p[4]||'',reason:p[5]||''};
  });
}
function parseFlights(txt){
  return txt.split('\n').filter(l=>l.startsWith('FLIGHT|')).map(l=>{
    const p=l.split('|');
    return {airline:p[1]||'',dep:p[2]||'',arr:p[3]||'',dur:p[4]||'',price:p[5]||'',direct:p[6]||''};
  });
}
function parseSched(txt){
  const days=[]; let cur=null;
  txt.split('\n').forEach(l=>{
    l=l.trim();
    if(l.startsWith('DAY|')){const p=l.split('|');cur={day:p[1],theme:p[2]||'',items:[]};days.push(cur);}
    else if(l.startsWith('ACT|')&&cur){const p=l.split('|');cur.items.push({type:'act',time:p[1]||'',text:p[2]||''});}
    else if(l.startsWith('MEAL|')&&cur){const p=l.split('|');cur.items.push({type:'meal',meal:p[1]||'',name:p[2]||'',desc:p[3]||'',rating:p[4]||''});}
  });
  return days;
}
function parseCars(txt){
  return txt.split('\n').filter(l=>l.startsWith('CAR|')).map(l=>{
    const p=l.split('|');
    return {name:p[1]||'',grade:p[2]||'',seats:p[3]||'',trans:p[4]||'',day:p[5]||'',total:p[6]||'',note:p[7]||''};
  });
}
function parseCosts(txt){
  return txt.split('\n').filter(l=>l.startsWith('COST|')).map(l=>{
    const p=l.split('|');
    return {label:p[1]||'',amount:p[2]||'',desc:p[3]||''};
  });
}

// ──────────────────────────────────────────────
// 렌더
// ──────────────────────────────────────────────
function renderDests(dests){
  return `<div class="dest-grid">${dests.map((d,i)=>`
    <div class="dest-card ${i===0?'top':''}">
      <div class="dest-flag">${d.flag}</div>
      <div class="dest-name">${d.name}</div>
      <div class="dest-sub">${d.sub}</div>
      <div class="dest-score">추천도 ${d.score}점</div>
      <div class="dest-reason">${d.reason}</div>
    </div>`).join('')}</div>`;
}

function renderFlights(flights){
  return flights.map(f=>`
    <div class="flight-card">
      <div class="flt-top"><span class="flt-airline">${f.airline}</span><span class="flt-price">${f.price}</span></div>
      <div class="flt-row">
        <span class="flt-time">${f.dep}</span>
        <div class="flt-line"><span class="flt-dur">${f.dur}</span></div>
        <span class="flt-time">${f.arr}</span>
      </div>
      <span class="badge">${f.direct}</span>
    </div>`).join('') + `<p class="tip">* 왕복 기준, 성수기·예약 시점에 따라 가격이 달라질 수 있습니다.</p>`;
}

function renderSched(days){
  return days.map(d=>`
    <div class="day-block">
      <div class="day-dot"></div>
      <div class="day-title">Day ${d.day} — ${d.theme}</div>
      ${d.items.map(item=>item.type==='act'
        ? `<div class="item-row"><span class="item-time">${item.time}</span><span class="item-text">${item.text}</span></div>`
        : `<div class="item-row"><span class="meal-tag">${item.meal}</span><span class="item-text"><span class="rest-name">${item.name}</span> <span class="rest-desc">${item.desc} ${item.rating}</span></span></div>`
      ).join('')}
    </div>`).join('');
}

function renderCars(cars){
  return cars.map(c=>`
    <div class="car-card">
      <div><div class="car-name">${c.name}</div><div class="car-spec">${c.grade}·${c.trans}·${c.seats}·${c.note}</div></div>
      <div><div class="car-day">${c.day}<span style="font-size:.7rem;font-weight:400;color:#6B8EB0">/일</span></div><div class="car-total">합계 ${c.total}</div></div>
    </div>`).join('') + `<p class="tip">* 국제운전면허증 필수. 유류비·톨비 별도.</p>`;
}

function renderCosts(costs, peopleLabel){
  return `<div class="cost-bar">${costs.map(c=>`
    <div class="cost-item ${c.label.includes('합계')?'total':''}">
      <div class="cl">${c.label}</div>
      <div class="cv">${c.amount}</div>
    </div>`).join('')}</div>
    <p class="tip">* 모든 금액은 예상치이며 실제 예약 시점·시즌에 따라 달라질 수 있습니다.</p>`;
}

function secWrap(icon, title, inner){
  return `<div class="sec-wrap fade-in"><div class="sec-head"><span>${icon}</span><span>${title}</span></div><div class="sec-body">${inner}</div></div>`;
}

// ──────────────────────────────────────────────
// 메인 에이전트 실행
// ──────────────────────────────────────────────
async function runAgent(){


  const kw   = getKeywords();
  const {adults,children} = getPeople();
  const total = adults+children;
  const peopleLabel = `성인${adults}명`+(children>0?`+아동${children}명`:'');
  const btn  = document.getElementById('runBtn');
  const errBox = document.getElementById('errorBox');

  btn.disabled = true;
  errBox.classList.add('hidden');
  document.getElementById('agentWrap').classList.remove('hidden');
  document.getElementById('resultWrap').classList.add('hidden');
  document.getElementById('resultWrap').innerHTML = '';
  ['dest','flight','sched','car','cost'].forEach(id=>agState(id,'','대기 중'));

  try {
    // Agent 1: 여행지
    agState('dest','running','탐색 중...');
    const rawDest = await callGemini(pDest(kw, travelType, nights));
    const dests   = parseDests(rawDest);
    const topDest = dests[0]?.name || '여행지';
    agState('dest','done','완료 ✓');

    // Agent 2: 항공
    agState('flight','running','검색 중...');
    const rawFlight = await callGemini(pFlight(topDest, travelType, nights));
    const flights   = parseFlights(rawFlight);
    agState('flight','done','완료 ✓');

    // Agent 3: 일정
    agState('sched','running','생성 중...');
    const rawSched = await callGemini(pSched(topDest, kw, nights, travelType));
    const schedule = parseSched(rawSched);
    agState('sched','done','완료 ✓');

    // Agent 4: 렌터카 (해외 or 섬)
    const needCar = travelType==='overseas'||['제주','오키나와','발리','세부','푸켓'].some(w=>topDest.includes(w));
    let rawCar='', cars=[];
    if(needCar){
      agState('car','running','검색 중...');
      rawCar = await callGemini(pCar(topDest, nights, total));
      cars   = parseCars(rawCar);
      agState('car','done','완료 ✓');
    } else {
      agState('car','skip','해당없음');
    }

    // Agent 5: 비용
    agState('cost','running','계산 중...');
    const rawCost = await callGemini(pCost(topDest,travelType,nights,rawFlight,rawCar,adults,children));
    const costs   = parseCosts(rawCost);
    agState('cost','done','완료 ✓');

    // 결과 렌더
    const flightTitle = travelType==='overseas'?'항공편':'교통편';
    const costTitle   = `예상 비용 (${peopleLabel} 기준)`;
    let html = `
      <h2 style="font-size:1.1rem;font-weight:700;color:#0B3D5E;margin-bottom:.3rem">${topDest} — ${nights}박${nights+1}일 여행 계획</h2>
      <p style="font-size:.78rem;color:#6B8EB0;margin-bottom:1rem">키워드: ${kw} · ${travelType==='domestic'?'국내':'해외'} · ${peopleLabel}</p>
      ${secWrap('🗺️','추천 여행지',renderDests(dests))}
      ${secWrap('✈️',flightTitle,renderFlights(flights))}
      ${secWrap('📅','여행 일정 (맛집 포함)',renderSched(schedule))}
      ${needCar&&cars.length ? secWrap('🚗','렌터카',renderCars(cars)) : ''}
      ${secWrap('💰',costTitle,renderCosts(costs,peopleLabel))}
      <button onclick="resetAll()" style="width:100%;padding:11px;background:white;border:1.5px solid #E2ECF4;border-radius:12px;font-size:.9rem;color:#334E6A;cursor:pointer;margin-top:.5rem;font-family:inherit">🔄 다시 검색하기</button>
    `;
    const rw = document.getElementById('resultWrap');
    rw.innerHTML = html;
    rw.classList.remove('hidden');

  } catch(e){
    errBox.textContent = '❌ 오류: ' + e.message;
    errBox.classList.remove('hidden');
    ['dest','flight','sched','car','cost'].forEach(id=>agState(id,'',''));
  }

  btn.disabled = false;
}

function resetAll(){
  document.getElementById('resultWrap').innerHTML='';
  document.getElementById('resultWrap').classList.add('hidden');
  document.getElementById('agentWrap').classList.add('hidden');
  document.getElementById('errorBox').classList.add('hidden');
  ['dest','flight','sched','car','cost'].forEach(id=>agState(id,'','대기 중'));
}
</script>
