<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 플래너 AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F1923;
    --navy-mid: #1A2B3C;
    --sand: #E8D5B0;
    --sand-light: #F5EDD8;
    --coral: #FF6B47;
    --mint: #4ECDC4;
    --white: #FAFAF8;
    --gray: #8A9BB0;
    --border: rgba(232,213,176,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    padding: 28px 40px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,25,35,0.92);
    backdrop-filter: blur(12px);
  }
  .logo-icon { font-size: 28px; }
  .logo-text { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--sand); letter-spacing: 0.04em; }
  .logo-sub { font-size: 11px; color: var(--gray); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 1px; }
  .header-badge {
    margin-left: auto;
    background: rgba(78,205,196,0.1);
    border: 1px solid rgba(78,205,196,0.3);
    color: var(--mint);
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
  }

  /* ── MAIN LAYOUT ── */
  main { max-width: 860px; margin: 0 auto; padding: 48px 24px 80px; }

  /* ── HERO ── */
  .hero { text-align: center; margin-bottom: 52px; }
  .hero-eyebrow {
    display: inline-block; font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--coral); margin-bottom: 16px;
    padding: 4px 12px; border: 1px solid rgba(255,107,71,0.3); border-radius: 20px;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 6vw, 52px);
    color: var(--sand);
    line-height: 1.15;
    margin-bottom: 16px;
  }
  .hero h1 span { color: var(--coral); }
  .hero p { font-size: 15px; color: var(--gray); line-height: 1.7; max-width: 480px; margin: 0 auto; }

  /* ── FORM CARD ── */
  .form-card {
    background: var(--navy-mid);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    margin-bottom: 32px;
  }
  .section-label {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--mint); margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* keyword input */
  .keyword-input-wrap { position: relative; margin-bottom: 28px; }
  .keyword-input-wrap input {
    width: 100%; padding: 16px 20px; font-size: 16px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 12px; color: var(--white); outline: none;
    font-family: 'Noto Sans KR', sans-serif; transition: border-color 0.2s;
  }
  .keyword-input-wrap input::placeholder { color: var(--gray); }
  .keyword-input-wrap input:focus { border-color: var(--coral); }
  .keyword-examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .keyword-chip {
    font-size: 12px; padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--gray);
    cursor: pointer; transition: all 0.2s; background: transparent;
  }
  .keyword-chip:hover { border-color: var(--sand); color: var(--sand); }

  /* toggle group */
  .toggle-group { display: flex; gap: 10px; margin-bottom: 28px; }
  .toggle-btn {
    flex: 1; padding: 13px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--gray); cursor: pointer; font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif; transition: all 0.22s; text-align: center;
  }
  .toggle-btn .emoji { font-size: 18px; display: block; margin-bottom: 4px; }
  .toggle-btn.active {
    background: rgba(255,107,71,0.12); border-color: var(--coral); color: var(--white);
  }

  /* people selector */
  .people-row { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
  .people-btn {
    padding: 9px 18px; border-radius: 30px; border: 1px solid var(--border);
    background: transparent; color: var(--gray); cursor: pointer; font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
  }
  .people-btn.active { background: rgba(78,205,196,0.12); border-color: var(--mint); color: var(--mint); }

  /* slider */
  .slider-wrap { margin-bottom: 32px; }
  .slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .slider-label { font-size: 14px; color: var(--white); }
  .slider-value { font-size: 26px; font-family: 'Playfair Display', serif; color: var(--sand); }
  .slider-value span { font-size: 14px; color: var(--gray); font-family: 'Noto Sans KR', sans-serif; }
  input[type=range] {
    width: 100%; appearance: none; height: 4px;
    background: linear-gradient(to right, var(--coral) 0%, var(--coral) 50%, rgba(255,255,255,0.1) 50%);
    border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--white); border: 3px solid var(--coral); cursor: pointer;
    box-shadow: 0 0 0 4px rgba(255,107,71,0.15); transition: box-shadow 0.2s;
  }
  input[type=range]::-webkit-slider-thumb:hover { box-shadow: 0 0 0 7px rgba(255,107,71,0.2); }
  .slider-ticks { display: flex; justify-content: space-between; margin-top: 6px; }
  .slider-tick { font-size: 11px; color: var(--gray); }

  /* submit btn */
  .submit-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--coral), #e55a3a);
    color: white; font-size: 16px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    transition: all 0.25s; overflow: hidden;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,107,71,0.35); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── AGENTS SECTION ── */
  .agents-section { display: none; }
  .agents-section.visible { display: block; animation: fadeUp 0.5s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .agents-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 620px) { .agents-grid { grid-template-columns: 1fr; } }

  .agent-card {
    background: var(--navy-mid); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; transition: border-color 0.3s;
  }
  .agent-card.full-width { grid-column: 1 / -1; }
  .agent-card.loading { border-color: rgba(78,205,196,0.3); }
  .agent-card.done { border-color: rgba(78,205,196,0.5); }
  .agent-card.skipped { opacity: 0.5; }

  .agent-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .agent-icon { font-size: 22px; }
  .agent-name { font-size: 14px; font-weight: 700; color: var(--sand); }
  .agent-status {
    margin-left: auto; font-size: 11px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--gray);
  }
  .agent-status.thinking { border-color: var(--mint); color: var(--mint); animation: pulse 1.5s infinite; }
  .agent-status.done { border-color: rgba(78,205,196,0.5); color: var(--mint); }
  .agent-status.skipped { border-color: var(--border); color: var(--gray); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .agent-body { font-size: 13px; color: var(--gray); line-height: 1.7; min-height: 60px; }
  .agent-body.loaded { color: var(--white); }

  /* skeleton */
  .skeleton { display: flex; flex-direction: column; gap: 8px; }
  .skel-line {
    height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite;
  }
  .skel-line.short { width: 60%; }
  .skel-line.mid { width: 80%; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* result content */
  .result-content h4 { color: var(--sand); font-size: 13px; margin: 12px 0 6px; }
  .result-content h4:first-child { margin-top: 0; }
  .result-content p { font-size: 13px; color: rgba(250,250,248,0.85); line-height: 1.8; margin-bottom: 8px; }
  .result-content ul { padding-left: 16px; }
  .result-content li { font-size: 13px; color: rgba(250,250,248,0.85); line-height: 1.8; margin-bottom: 3px; }
  .result-content strong { color: var(--sand); }
  .result-content .day-block {
    background: rgba(255,255,255,0.03); border-left: 3px solid var(--coral);
    padding: 10px 14px; border-radius: 0 8px 8px 0; margin-bottom: 10px;
  }
  .result-content .day-block .day-title { color: var(--coral); font-weight: 700; font-size: 13px; margin-bottom: 6px; }

  /* summary bar */
  .summary-bar {
    background: rgba(78,205,196,0.05); border: 1px solid rgba(78,205,196,0.2);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
    display: flex; gap: 24px; flex-wrap: wrap;
  }
  .summary-item { font-size: 13px; }
  .summary-item span { color: var(--gray); margin-right: 6px; }
  .summary-item strong { color: var(--mint); }

  /* error */
  .error-msg {
    background: rgba(255,107,71,0.08); border: 1px solid rgba(255,107,71,0.3);
    border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--coral); margin-top: 8px;
  }

  /* reset btn */
  .reset-btn {
    display: block; margin: 28px auto 0; padding: 11px 28px;
    border-radius: 30px; border: 1px solid var(--border);
    background: transparent; color: var(--gray); cursor: pointer;
    font-size: 14px; font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
  }
  .reset-btn:hover { border-color: var(--sand); color: var(--sand); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <span class="logo-icon">✈</span>
  <div>
    <div class="logo-text">Journey AI</div>
    <div class="logo-sub">Multi-Agent Travel Planner</div>
  </div>
  <div class="header-badge">🤖 AI powered</div>
</header>

<main>
  <!-- HERO -->
  <div class="hero">
    <div class="hero-eyebrow">AI 멀티 에이전트 여행 플래너</div>
    <h1>어디로<br><span>떠나실</span> 건가요?</h1>
    <p>숙박 · 교통 · 렌트카 · 일정 에이전트가 동시에 작동하여<br>최적의 여행 계획을 만들어 드립니다.</p>
  </div>

  <!-- FORM -->
  <div class="form-card">
    <div class="section-label">여행 키워드</div>
    <div class="keyword-input-wrap">
      <input type="text" id="keyword" placeholder="예: 부산 바다, 제주 힐링, 도쿄 음식 여행..." />
    </div>
    <div class="keyword-examples">
      <button class="keyword-chip" onclick="setKeyword('부산 바다')">🌊 부산 바다</button>
      <button class="keyword-chip" onclick="setKeyword('제주 자연')">🌿 제주 자연</button>
      <button class="keyword-chip" onclick="setKeyword('도쿄 식도락')">🍜 도쿄 식도락</button>
      <button class="keyword-chip" onclick="setKeyword('방콕 휴양')">🏖 방콕 휴양</button>
      <button class="keyword-chip" onclick="setKeyword('파리 문화')">🗼 파리 문화</button>
      <button class="keyword-chip" onclick="setKeyword('설악산 등산')">⛰ 설악산 등산</button>
    </div>

    <div class="section-label" style="margin-top:28px">여행 지역</div>
    <div class="toggle-group">
      <button class="toggle-btn active" id="btn-domestic" onclick="setRegion('domestic')">
        <span class="emoji">🇰🇷</span>국내
      </button>
      <button class="toggle-btn" id="btn-overseas" onclick="setRegion('overseas')">
        <span class="emoji">🌍</span>해외
      </button>
    </div>

    <div class="section-label">인원수</div>
    <div class="people-row" id="peopleRow">
      <button class="people-btn active" onclick="setPeople(this, '1인')">혼자</button>
      <button class="people-btn" onclick="setPeople(this, '2인')">2인</button>
      <button class="people-btn" onclick="setPeople(this, '3인')">3인</button>
      <button class="people-btn" onclick="setPeople(this, '4인')">4인</button>
      <button class="people-btn" onclick="setPeople(this, '5인 이상')">5인+</button>
    </div>

    <div class="section-label">여행 기간</div>
    <div class="slider-wrap">
      <div class="slider-header">
        <span class="slider-label">일수 선택</span>
        <div class="slider-value" id="sliderVal">3<span> 박 4 일</span></div>
      </div>
      <input type="range" id="daysSlider" min="1" max="14" value="3" oninput="updateSlider(this.value)">
      <div class="slider-ticks">
        <span class="slider-tick">당일</span>
        <span class="slider-tick">3박</span>
        <span class="slider-tick">6박</span>
        <span class="slider-tick">9박</span>
        <span class="slider-tick">14박</span>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="startPlanning()">🗺 여행 계획 시작하기</button>
  </div>

  <!-- AGENTS RESULT -->
  <div class="agents-section" id="agentsSection">
    <div class="section-label" style="margin-bottom:16px">에이전트 분석 결과</div>
    <div class="summary-bar" id="summaryBar"></div>
    <div class="agents-grid" id="agentsGrid"></div>
    <button class="reset-btn" onclick="resetForm()">↩ 다시 계획하기</button>
  </div>
</main>

<script>
// ─── API KEY (내장) ───────────────────────────────────────
const API_KEY = 'AQ.Ab8RN6JJeBi6-zAG9Ktyj2skJ278vMfqKgrfo6vNN4IrcJuxvw';

// ─── STATE ────────────────────────────────────────────────
let region = 'domestic';
let people = '1인';
let days = 3;

// ─── INIT ─────────────────────────────────────────────────
window.onload = () => updateSlider(3);

// ─── FORM CONTROLS ────────────────────────────────────────
function setKeyword(kw) {
  document.getElementById('keyword').value = kw;
}
function setRegion(r) {
  region = r;
  document.getElementById('btn-domestic').classList.toggle('active', r === 'domestic');
  document.getElementById('btn-overseas').classList.toggle('active', r === 'overseas');
}
function setPeople(btn, val) {
  people = val;
  document.querySelectorAll('.people-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function updateSlider(val) {
  days = parseInt(val);
  const nights = days - 1;
  document.getElementById('sliderVal').innerHTML =
    days === 1 ? '당일<span> 치기</span>' : `${nights}<span> 박 ${days} 일</span>`;
  const pct = ((days - 1) / 13) * 100;
  document.getElementById('daysSlider').style.background =
    `linear-gradient(to right, var(--coral) 0%, var(--coral) ${pct}%, rgba(255,255,255,0.1) ${pct}%)`;
}

// ─── MAIN PLANNING ────────────────────────────────────────
async function startPlanning() {
  const keyword = document.getElementById('keyword').value.trim();
  if (!keyword) { alert('여행 키워드를 입력해주세요.'); return; }

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('agentsSection').classList.add('visible');
  setTimeout(() => document.getElementById('agentsSection').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);

  const isDomesticInland = region === 'domestic';
  const nights = days - 1;
  const tripLabel = days === 1 ? '당일치기' : `${nights}박 ${days}일`;
  const dest = region === 'domestic' ? '국내' : '해외';

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-item"><span>🔍 키워드</span><strong>${keyword}</strong></div>
    <div class="summary-item"><span>📍 지역</span><strong>${dest}</strong></div>
    <div class="summary-item"><span>👥 인원</span><strong>${people}</strong></div>
    <div class="summary-item"><span>📅 기간</span><strong>${tripLabel}</strong></div>
  `;

  const agents = [
    {
      id: 'lodging', icon: '🏨', name: '숙박 에이전트',
      skip: false, full: false,
      prompt: buildPrompt('lodging', keyword, region, people, days, tripLabel)
    },
    {
      id: 'transport',
      icon: isDomesticInland ? '🚗' : '✈️',
      name: isDomesticInland ? '자차 경로 에이전트' : '교통 에이전트',
      skip: false, full: false,
      prompt: buildPrompt('transport', keyword, region, people, days, tripLabel)
    },
    {
      id: 'rental', icon: '🚙', name: '렌트카 에이전트',
      skip: isDomesticInland, full: false,
      prompt: buildPrompt('rental', keyword, region, people, days, tripLabel)
    },
    {
      id: 'itinerary', icon: '📋', name: '일정 에이전트',
      skip: false, full: true,
      prompt: buildPrompt('itinerary', keyword, region, people, days, tripLabel)
    }
  ];

  const grid = document.getElementById('agentsGrid');
  grid.innerHTML = '';
  agents.forEach(agent => {
    const card = document.createElement('div');
    card.id = `card-${agent.id}`;
    card.className = `agent-card${agent.full ? ' full-width' : ''}${agent.skip ? ' skipped' : ''}`;
    card.innerHTML = `
      <div class="agent-header">
        <span class="agent-icon">${agent.icon}</span>
        <span class="agent-name">${agent.name}</span>
        <span class="agent-status ${agent.skip ? 'skipped' : 'thinking'}" id="status-${agent.id}">
          ${agent.skip ? '국내 내륙 생략' : '분석중...'}
        </span>
      </div>
      <div class="agent-body" id="body-${agent.id}">
        ${agent.skip
          ? '<p style="color:var(--gray);font-size:13px;">국내 내륙 여행에는 렌트카/교통 에이전트가 생략됩니다. 자차 경로 에이전트가 대신 안내합니다.</p>'
          : '<div class="skeleton"><div class="skel-line"></div><div class="skel-line mid"></div><div class="skel-line short"></div><div class="skel-line"></div><div class="skel-line mid"></div></div>'
        }
      </div>`;
    grid.appendChild(card);
  });

  await Promise.allSettled(agents.map(a => a.skip ? Promise.resolve() : callGemini(a.prompt, a.id)));
  document.getElementById('submitBtn').disabled = false;
}

// ─── PROMPT BUILDERS ──────────────────────────────────────
function buildPrompt(type, keyword, region, people, days, tripLabel) {
  const base = `여행 정보: "${keyword}", ${region === 'domestic' ? '국내' : '해외'} 여행, ${people}, ${tripLabel}`;
  const prompts = {
    lodging: `당신은 숙박 전문 여행 에이전트입니다.\n${base}\n위 정보를 바탕으로 추천 숙박 옵션을 안내해주세요.\n- 숙박 유형 2~3가지 (예: 호텔, 펜션, 게스트하우스 등)\n- 각 유형의 특징, 예상 가격대 (1박 기준)\n- 추천 이유\n- 예약 팁\n\n마크다운 없이 자연스러운 텍스트로 답변하되, 섹션은 **굵게** 표시하세요. 200자 내외로 간결하게.`,

    transport: region === 'domestic'
      ? `당신은 자동차 여행 경로 전문가입니다.\n${base}\n서울 출발 기준으로 "${keyword}" 여행지까지 자차 이동 경로를 안내해주세요.\n- 추천 경로 (고속도로/국도)\n- 예상 소요시간 및 거리\n- 주요 경유지 또는 휴게소\n- 주차 팁\n\n마크다운 없이 자연스러운 텍스트로. 섹션은 **굵게**. 200자 내외.`
      : `당신은 해외여행 교통 전문 에이전트입니다.\n${base}\n위 여행지의 교통 정보를 안내해주세요.\n- 한국 출발 항공편 정보 (주요 항공사, 비행 시간)\n- 현지 이동수단 (지하철, 버스, 택시, 기차 등)\n- 교통 패스 또는 앱 추천\n- 예산 가이드\n\n마크다운 없이 자연스러운 텍스트로. 섹션은 **굵게**. 200자 내외.`,

    rental: `당신은 렌트카 전문 여행 에이전트입니다.\n${base}\n위 여행에 적합한 렌트카 정보를 안내해주세요.\n- 추천 차량 종류 (인원수 고려)\n- 예상 렌트 비용 (${tripLabel} 기준)\n- 주요 렌터카 업체\n- 보험 및 주의사항\n\n마크다운 없이 자연스러운 텍스트로. 섹션은 **굵게**. 200자 내외.`,

    itinerary: `당신은 여행 일정 전문 에이전트입니다.\n${base}\n위 정보를 바탕으로 상세 여행 일정을 작성해주세요.\n각 날짜별로:\n- 오전/오후/저녁 활동\n- 추천 식당 또는 먹거리\n- 예상 소요 시간\n- 이동 팁\n\n형식: "**DAY 1 (날짜 테마)**" 로 각 날을 시작하고, 활동은 "- 시간: 내용" 형식으로. 마크다운 없이. 300자 이내로 핵심만 간결하게.`
  };
  return prompts[type];
}

// ─── GEMINI API CALL ──────────────────────────────────────
async function callGemini(prompt, agentId) {
  const statusEl = document.getElementById(`status-${agentId}`);
  const bodyEl = document.getElementById(`body-${agentId}`);
  const card = document.getElementById(`card-${agentId}`);
  try {
    card.classList.add('loading');
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 600 }
        })
      }
    );
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '응답을 받지 못했습니다.';
    bodyEl.innerHTML = `<div class="result-content">${formatResponse(text)}</div>`;
    bodyEl.classList.add('loaded');
    statusEl.textContent = '완료';
    statusEl.className = 'agent-status done';
    card.classList.remove('loading');
    card.classList.add('done');
  } catch (err) {
    bodyEl.innerHTML = `<div class="error-msg">⚠️ 오류: ${err.message}</div>`;
    statusEl.textContent = '오류';
    statusEl.className = 'agent-status';
    card.classList.remove('loading');
  }
}

// ─── FORMAT RESPONSE ──────────────────────────────────────
function formatResponse(text) {
  let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(<strong>DAY \d+.*?<\/strong>)/g,
    m => `</p><div class="day-block"><div class="day-title">${m}</div><p>`);
  const lines = html.split('\n').filter(l => l.trim());
  let result = '';
  lines.forEach(line => {
    if (line.startsWith('- ')) result += `<li>${line.slice(2)}</li>`;
    else if (line.includes('<div class="day-block">')) result += line;
    else result += `<p>${line}</p>`;
  });
  return result.replace(/(<li>.*?<\/li>)+/gs, m => `<ul>${m}</ul>`);
}

// ─── RESET ────────────────────────────────────────────────
function resetForm() {
  document.getElementById('agentsSection').classList.remove('visible');
  document.getElementById('keyword').value = '';
  document.getElementById('submitBtn').disabled = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
